<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Startup Trail: The Road to Launch City</title>
<style>
:root{--bg:#17120e;--card:#241c15;--card2:#32271c;--ink:#fff6e3;--mut:#e0d2b3;--gold:#ffd24a;--red:#ff8a78;--green:#6ef0a0;--blue:#8cc8ff;--line:#8a6d3f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 system-ui,"Segoe UI",Arial,sans-serif}
#app{max-width:1000px;margin:0 auto;padding:12px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px}
h1{font:800 24px ui-monospace,Consolas,monospace;color:var(--gold);margin:0;letter-spacing:1px;text-shadow:2px 2px 0 #000}
h2{font:700 22px ui-monospace,Consolas,monospace;margin:0 0 8px;color:var(--gold)}
h2 .role{font:500 15px system-ui,sans-serif;color:var(--mut);margin-left:10px}
h2.ok{color:var(--green)}h2.no{color:var(--red)}
#ctrl{display:flex;gap:6px;flex-wrap:wrap}
.btn{font:700 17px system-ui,sans-serif;min-height:44px;padding:8px 16px;border-radius:8px;border:3px solid var(--line);background:var(--card2);color:var(--ink);cursor:pointer;transition:transform .08s}
.btn:hover{transform:translateY(-2px);border-color:var(--gold)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--gold);color:#241800;border-color:#fff2b0}
.btn.alt{background:#1d3550;border-color:#5b8fc0}
.btn.ghost{background:transparent;font-size:15px;min-height:36px}
.btn.sm{min-height:36px;padding:4px 12px;font-size:15px}
.btn[aria-pressed="true"]{background:#2d5a3c;border-color:var(--green)}
.btn[aria-pressed="true"]::before{content:"\2713  "}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
:focus-visible{outline:4px solid #fff;outline-offset:3px}
#hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.stat{background:var(--card);border:3px solid var(--line);border-radius:8px;padding:6px 12px;font:700 18px ui-monospace,Consolas,monospace}
.stat small{display:block;font:600 13px system-ui;color:var(--mut);letter-spacing:.5px}
.stat.pop{animation:pop .5s}
.bar{height:8px;background:#000;border-radius:4px;margin-top:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);transition:width .6s}
#map ol{list-style:none;display:flex;margin:8px 0;padding:0;gap:4px}
#map li{flex:1;text-align:center;font:600 13px system-ui;padding:6px 2px;border-radius:6px;background:var(--card);border:2px solid #4a3a26;color:var(--mut)}
#map li.done{background:#2d5a3c;border-color:var(--green);color:#fff}
#map li.done::after{content:" \2713"}
#map li.cur{background:var(--gold);color:#241800;border-color:#fff2b0}
#scene{width:100%;aspect-ratio:8/3;image-rendering:pixelated;border:4px solid var(--line);border-radius:8px;display:block;background:#000}
#panel{background:var(--card);border:4px solid var(--line);border-radius:8px;padding:18px 22px;margin-top:10px;min-height:280px}
#panel h2:focus{outline:none}
.say{font-size:20px;margin:6px 0 14px;min-height:3.2em}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px}
.asks{display:flex;flex-wrap:wrap;gap:8px;margin-right:auto;align-items:center}.asks .lbl{color:var(--mut);font-size:15px}
.opts{display:grid;gap:10px}.opt{text-align:left}
.card{background:var(--card2);border:3px solid #5a4630;border-radius:8px;padding:10px 14px;margin:8px 0}
table{border-collapse:collapse;width:100%;margin:8px 0}
caption{text-align:left;color:var(--mut);font-size:15px;padding-bottom:4px}
th,td{border:2px solid #5a4630;padding:6px 10px;text-align:left}th{background:#3b2d1d}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.big{font:800 26px ui-monospace,Consolas,monospace;color:var(--gold)}
.dots{display:flex;flex-wrap:wrap;gap:3px;min-height:22px}
.dots i{width:14px;height:14px;background:var(--blue);border:2px solid #fff;animation:pop .35s both}
.cells{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;margin:8px 0}
.cells b{aspect-ratio:1;font:700 11px ui-monospace;display:grid;place-items:center;border:1px solid #000;color:#000;animation:pop .3s}
.cells b.N{background:#8cc8ff}.cells b.W{background:#ffb86b}.cells b.S{background:#6ef0a0}.cells b.E{background:#3a2c1d;border:1px dashed #8a6d3f}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
canvas.chart{width:100%;max-width:640px;background:#120d09;border:3px solid var(--line);border-radius:6px;display:block;margin:6px 0}
.tag{display:inline-block;padding:1px 8px;border:2px solid var(--line);border-radius:6px;font-size:14px;margin-left:6px}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
body.noanim *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){body{font-size:16px}#hud{grid-template-columns:1fr 1fr}#map li{font-size:11px}.cells{grid-template-columns:repeat(15,1fr)}}
@media print{#ctrl,#map,#scene,#hud,.noprint{display:none!important}body{background:#fff;color:#000}#panel{border:1px solid #000;background:#fff;color:#000}}
</style>
</head>
<body>
<div id="app">
 <header>
  <h1>STARTUP TRAIL</h1>
  <div id="ctrl" role="group" aria-label="Game settings">
   <button class="btn sm" id="bVoice" type="button" aria-pressed="true">Voice</button>
   <button class="btn sm" id="bSfx" type="button" aria-pressed="true">Sound effects</button>
   <button class="btn sm" id="bAnim" type="button" aria-pressed="true">Animation</button>
  </div>
 </header>
 <div id="hud" role="group" aria-label="Your business stats">
  <div class="stat" id="sCash"><small>CASH</small><span>$5,000</span></div>
  <div class="stat" id="sRep"><small>REPUTATION</small><span>50</span><div class="bar"><i style="width:50%"></i></div></div>
  <div class="stat" id="sScore"><small>SCORE</small><span>0</span></div>
 </div>
 <nav id="map" aria-label="Trail progress"><ol></ol></nav>
 <canvas id="scene" width="320" height="120" role="img" aria-label="Pixel art scene of your food wagon on the trail"></canvas>
 <main id="panel"></main>
 <div id="sr" class="sr-only" aria-live="assertive"></div>
</div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const fmt=n=>(n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString('en-US');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const S={lvl:0,cash:5000,rep:50,score:0,stars:[],tr:0,voice:true,sfx:true,anim:!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)};

/* ---------- sound effects ---------- */
let AC;
function beep(f,d,type,v,delay){if(!S.sfx)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(delay||0);o.type=type||'square';o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(v||.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d);}catch(e){}}
const sfx={click:()=>beep(520,.06),good:()=>{beep(660,.1);beep(880,.14,0,0,.1);beep(1175,.2,0,0,.22)},bad:()=>{beep(220,.22,'sawtooth');beep(150,.3,'sawtooth',.04,.18)},coin:()=>{beep(988,.07);beep(1319,.16,0,0,.07)},boom:()=>beep(90,.5,'sawtooth',.06)};

/* ---------- narration (browser voice) ---------- */
let voice=null;
function pickVoice(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));const pref=[/natural/i,/neural/i,/aria|jenny|davis|guy/i,/google us english/i,/samantha|ava|allison|serena|karen|zira/i];for(const p of pref){const f=vs.find(v=>p.test(v.name));if(f){voice=f;return;}}voice=vs[0]||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(t,pitch){if(!S.voice||!('speechSynthesis' in window)||!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.rate=.96;u.pitch=pitch||1;speechSynthesis.speak(u);}catch(e){}}

/* ---------- pixel scene ---------- */
const cv=$('#scene'),cx=cv.getContext('2d'),W=320,H=120;
const TH=[
{n:'Idea Gulch',sky:['#ff9f5e','#ffe9ad'],far:'#b8764a',mid:'#8aa04e',gr:'#6a9440',gr2:'#5a8434',lm:'sign',sun:1},
{n:'Margin Meadow',sky:['#6ec1ff','#e0f5ff'],far:'#86b7a8',mid:'#62b25c',gr:'#4fa04c',gr2:'#418f40',lm:'stall'},
{n:'Budget Bridge',sky:['#92b0ff','#eaeeff'],far:'#8b90bd',mid:'#6e9f80',gr:'#5a8c62',gr2:'#4c7c54',lm:'bridge'},
{n:'Credit Crossing',sky:['#74cfd8','#e4fcf6'],far:'#6b9fae',mid:'#5ea08f',gr:'#4c8f7c',gr2:'#407f6c',lm:'bank'},
{n:'Storm Pass',sky:['#2e3350','#6a708f'],far:'#464b68',mid:'#363b52',gr:'#36463f',gr2:'#2b3833',lm:'cave',storm:1},
{n:'Compound Canyon',sky:['#2a1a4d','#ff8a5c'],far:'#a84f3a',mid:'#c8663e',gr:'#a8552f',gr2:'#944a29',lm:'arch',stars:1},
{n:'Launch City',sky:['#1a1f4d','#ff9a6b'],far:'#3b3f7a',mid:'#2e326a',gr:'#4a5a4a',gr2:'#3e4e3e',lm:'city',stars:1}
];
const NPCC=[['#ffcf9e','#3a6ea5','#e8453c'],['#e0ac7a','#a8552f','#7a4a1a'],['#f2c9a0','#6b3fa0','#ffd24a'],['#c68c5a','#2f7a5a','#333'],['#ffd0a8','#c0392b','#2b5a2b'],['#d9a070','#e0a030','#5a2f7a']];
const sc={mode:'stop',th:0,tp:0,cb:null,fire:[],flash:0,storm:0};
let T=0,scroll=0;
function R(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(Math.round(x),Math.round(y),w,h);}
function rnd(i){const x=Math.sin(i*127.1)*43758.5453;return x-Math.floor(x);}
function hills(base,amp,f,k,c){cx.fillStyle=c;for(let x=0;x<W;x+=2){const y=base+Math.sin((x+scroll*k)/f)*amp+Math.sin((x+scroll*k)/(f*.43))*amp*.4;cx.fillRect(x,Math.round(y),2,H-y);}}
function wheel(x,y,r){cx.save();cx.translate(x,y);cx.rotate(T*(sc.mode==='travel'?9:0));cx.fillStyle='#2a1a0c';cx.beginPath();cx.arc(0,0,r,0,7);cx.fill();cx.fillStyle='#c89b5c';cx.beginPath();cx.arc(0,0,r-1.5,0,7);cx.fill();cx.strokeStyle='#2a1a0c';cx.lineWidth=1;cx.beginPath();cx.moveTo(-r,0);cx.lineTo(r,0);cx.moveTo(0,-r);cx.lineTo(0,r);cx.stroke();cx.restore();}
function wagon(x,y){const mv=sc.mode==='travel'&&S.anim,b=mv?Math.round(Math.sin(T*16)):0;
 R(x,y-17+b,36,10,'#8a4b1f');R(x,y-17+b,36,2,'#b06a30');
 R(x+2,y-27+b,32,10,'#fff3d6');R(x+5,y-30+b,26,3,'#fff3d6');R(x+9,y-25+b,18,5,'#e8453c');R(x+11,y-24+b,14,1,'#fff3d6');
 wheel(x+9,y-5+b,6);wheel(x+28,y-5+b,6);
 R(x+36,y-13+b,9,1,'#222');
 const lg=mv?Math.sin(T*16)*2:0;
 R(x+44,y-21+b,18,9,'#6b3e1e');R(x+58,y-28+b,8,9,'#6b3e1e');R(x+64,y-25+b,4,4,'#4a2a12');R(x+58,y-31+b,2,4,'#4a2a12');R(x+60,y-27+b,1,1,'#fff');
 R(x+46,y-12+b,3,12+lg,'#4a2a12');R(x+52,y-12+b,3,12-lg,'#4a2a12');R(x+60,y-12+b,3,12-lg,'#4a2a12');R(x+43,y-20+b,2,7,'#3a200e');}
function person(x,y,i,talk){const c=NPCC[i%NPCC.length],b=S.anim?Math.round(Math.sin(T*3+i)):0;
 R(x+1,y-24+b,8,8,c[0]);R(x,y-27+b,10,4,c[2]);R(x+2,y-21+b,1,1,'#000');R(x+6,y-21+b,1,1,'#000');
 R(x,y-16+b,10,11,c[1]);R(x-2,y-15+b,2,8,c[1]);R(x+10,y-15+b,2,8,c[1]);R(x+1,y-5,3,5,'#2a2a3a');R(x+6,y-5,3,5,'#2a2a3a');
 if(talk&&S.anim&&Math.floor(T*2)%2===0){R(x+11,y-36,12,8,'#fff');R(x+13,y-33,2,2,'#222');R(x+17,y-33,2,2,'#222');R(x+21,y-33,2,2,'#222');}}
function pine(x,y,s){R(x+s,y-6,3,6,'#4a2f18');for(let i=0;i<4;i++)R(x+i*1.5,y-8-i*6,s*2+3-i*3,7,'#1f5a32');}
function landmark(k,x,y){
 if(k==='sign'){R(x,y-34,3,34,'#6b4a2a');R(x-14,y-38,32,12,'#c89b5c');R(x-12,y-36,28,2,'#8a5a2b');R(x-10,y-32,22,2,'#5a3a1a');R(x-10,y-29,16,2,'#5a3a1a');R(x+24,y-18,22,18,'#d9c9a0');R(x+22,y-22,26,5,'#e8453c');}
 else if(k==='stall'){for(let i=0;i<8;i++)R(x+i*5,y-34,5,6,i%2?'#fff':'#e8453c');R(x+1,y-28,2,28,'#6b4a2a');R(x+37,y-28,2,28,'#6b4a2a');R(x+3,y-14,34,14,'#8a5a2b');R(x+6,y-19,6,5,'#ffd24a');R(x+16,y-19,6,5,'#6ef0a0');R(x+26,y-19,6,5,'#ff8a78');}
 else if(k==='bridge'){R(x-34,y-3,110,6,'#2f6fc0');for(let i=0;i<8;i++)R(x-30+((i*14+T*10)%100),y-1,6,1,'#9fd0ff');R(x-20,y-18,80,5,'#a0a0a8');R(x-20,y-18,80,1,'#cfcfd8');R(x-14,y-14,6,14,'#8a8a92');R(x+14,y-14,6,14,'#8a8a92');R(x+42,y-14,6,14,'#8a8a92');R(x-20,y-26,2,10,'#6a6a72');R(x+58,y-26,2,10,'#6a6a72');R(x-20,y-27,80,2,'#6a6a72');}
 else if(k==='bank'){R(x,y-42,44,42,'#efe6cf');R(x-3,y-46,50,6,'#c9bf9f');R(x+19,y-54,6,8,'#c9bf9f');for(let i=0;i<4;i++)R(x+4+i*10,y-34,4,28,'#d6ccb0');R(x+16,y-14,12,14,'#5a3a1a');R(x+14,y-40,16,4,'#ffd24a');R(x+21,y-39,2,2,'#7a5a00');}
 else if(k==='cave'){R(x-6,y-30,52,30,'#2a2e3a');R(x+4,y-34,32,8,'#2a2e3a');R(x+8,y-22,24,22,'#07080c');R(x+12,y-28,16,8,'#07080c');R(x-8,y-14,10,14,'#3a3e4c');R(x+38,y-10,10,10,'#3a3e4c');}
 else if(k==='arch'){R(x-6,y-40,12,40,'#b3532f');R(x+40,y-40,12,40,'#b3532f');R(x-8,y-46,62,10,'#c8663e');R(x-4,y-50,54,6,'#d9764a');R(x+10,y-36,26,8,'#c8663e');R(x+18,y-30,10,2,'#ffb070');}
 else if(k==='city'){const hs=[34,48,28,56,40,30,50];for(let i=0;i<7;i++){const h=hs[i];R(x-20+i*12,y-h,10,h,'#1d2150');for(let j=0;j<h-6;j+=6)if(rnd(i*9+j)>.35)R(x-18+i*12,y-h+j+3,2,3,'#ffe27a');}R(x-30,y-3,100,3,'#555');}}
function drawScene(){
 const th=TH[sc.th],g=cx.createLinearGradient(0,0,0,84);g.addColorStop(0,th.sky[0]);g.addColorStop(1,th.sky[1]);cx.fillStyle=g;cx.fillRect(0,0,W,H);
 if(th.stars)for(let i=0;i<40;i++)if(i%3||Math.sin(T*3+i)>-.5)R(rnd(i)*W,rnd(i+50)*50,1,1,'#fff');
 if(th.sun){R(244,22,22,22,'#fff3a0');R(248,18,14,30,'#fff3a0');R(240,26,30,14,'#fff3a0');}
 if(!th.stars&&!th.storm)for(let i=0;i<4;i++){const cxp=((i*90-scroll*.15)%380+380)%380-40;R(cxp,14+i*9,28,6,'#ffffffcc');R(cxp+6,10+i*9,16,6,'#ffffffcc');}
 hills(60,10,34,.2,th.far);hills(72,7,22,.5,th.mid);
 if(sc.th!==2&&sc.th!==3)for(let i=0;i<6;i++){const px=((i*70-scroll*.7)%420+420)%420-30;pine(px,86,3);}
 R(0,84,W,36,th.gr);for(let i=0;i<14;i++){const sx=((i*30-scroll)%360+360)%360-20;R(sx,88+(i%3)*8,16,2,th.gr2);}
 R(0,96,W,12,'#8a6a3c');R(0,96,W,1,'#b08a50');for(let i=0;i<10;i++){const dx=((i*40-scroll*1.2)%400+400)%400-20;R(dx,102,16,2,'#6b4f28');}
 let lx=250;if(sc.mode==='travel'){const e=1-Math.pow(1-sc.tp,3);lx=420-e*(420-250);}
 landmark(th.lm,lx,96);
 if(sc.th===5||sc.th===6){}
 if(sc.mode==='stop'&&sc.npc!=null)person(196,96,sc.npc,sc.talk);
 wagon(sc.mode==='travel'?44+Math.sin(T*2)*2:40,100);
 if(th.storm||sc.storm){cx.fillStyle='#bcd4ffaa';for(let i=0;i<60;i++){const rx=((rnd(i)*W*1.3-T*140*(0.6+rnd(i+9)*.5))%(W*1.3)+W*1.3)%(W*1.3),ry=((rnd(i+3)*H+T*320)%H);cx.fillRect(Math.round(rx-20),Math.round(ry),1,5);}
  if(sc.flash>0){cx.fillStyle='rgba(255,255,255,'+Math.min(.7,sc.flash)+')';cx.fillRect(0,0,W,H);R(160,0,2,20,'#fff');R(158,20,2,18,'#fff');R(160,38,2,14,'#fff');sc.flash-=.08;}
  else if(sc.storm>1&&Math.random()<.02)sc.flash=1;}
 sc.fire=sc.fire.filter(p=>p.l>0);for(const p of sc.fire){p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.l-=.012;R(p.x,p.y,2,2,p.c);}
 if(sc.th===6&&S.anim&&Math.random()<.05)burst(40+Math.random()*240,20+Math.random()*30);
}
function burst(x,y){const c=['#ffd24a','#ff6b57','#6ef0a0','#8cc8ff','#fff'][Math.floor(Math.random()*5)];for(let i=0;i<24;i++){const a=i/24*6.28,s=.5+Math.random()*1.2;sc.fire.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c});}}
let last=0;
function frame(ts){const dt=Math.min(.05,((ts-last)/1000)||0);last=ts;
 if(S.anim){T+=dt;if(sc.mode==='travel'){sc.tp=Math.min(1,sc.tp+dt/3.4);scroll+=dt*(sc.tp<.85?120:120*(1-sc.tp)/.15+10);}else scroll+=dt*(sc.th===4?6:2);}
 else if(sc.mode==='travel')sc.tp=1;
 if(sc.mode==='travel'&&sc.tp>=1){sc.mode='stop';const cb=sc.cb;sc.cb=null;cb&&cb();}
 drawScene();requestAnimationFrame(frame);}
function setScene(th,opts){sc.th=th;Object.assign(sc,opts||{});cv.setAttribute('aria-label','Pixel art scene: '+TH[th].n+'. Your food wagon is '+(sc.mode==='travel'?'traveling.':'stopped.'));}
function travelTo(th,cb){sc.th=th;sc.mode='travel';sc.tp=0;sc.cb=cb;sc.npc=null;sc.talk=false;sc.storm=0;cv.setAttribute('aria-label','Pixel art scene: your wagon is traveling to '+TH[th].n);}

/* ---------- UI helpers ---------- */
const P=$('#panel');
